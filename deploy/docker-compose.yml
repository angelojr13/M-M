services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv/site
      - caddy_data:/data
      - caddy_config:/config

  # n8n: se activa mas adelante, cuando el bot este listo para desplegarse.
